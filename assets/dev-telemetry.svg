<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 840 280"
  width="840"
  height="280"
  role="img"
  aria-label="Arun Vpp — Product Engineering and Systems Matrix"
>
  <defs>
    <linearGradient id="boho-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241d18" />
      <stop offset="60%" stop-color="#1a1512" />
      <stop offset="100%" stop-color="#14100d" />
    </linearGradient>

    <style>
      .boho-font-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        fill: #f6efe3;
      }
      .boho-font-mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .boho-font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Card Outer Border and Canvas -->
  <rect x="1" y="1" width="838" height="278" rx="14" fill="url(#boho-card-bg)" stroke="#c86446" stroke-width="1.6" stroke-opacity="0.6" />

  <!-- Subtle Inner Stitch Rim -->
  <rect x="8" y="8" width="824" height="264" rx="10" fill="none" stroke="#6f8b6d" stroke-width="0.8" stroke-dasharray="4,4" stroke-opacity="0.35" />

  <!-- HEADER BAR -->
  <!-- Status Badge (Top Left) -->
  <rect x="26" y="24" width="232" height="24" rx="12" fill="#2d5438" fill-opacity="0.25" stroke="#6f8b6d" stroke-width="1" />
  <circle cx="40" cy="36" r="4.5" fill="#6f8b6d" />
  <circle cx="40" cy="36" r="2.5" fill="#a4c6a1" />
  <text x="52" y="40" class="boho-font-mono" font-size="10" font-weight="700" fill="#a4c6a1" letter-spacing="1">ACTIVE · PRODUCT ENGINEER</text>

  <!-- Profile Handle and Location (Top Right) -->
  <text x="814" y="40" text-anchor="end" class="boho-font-mono" font-size="11" fill="#d8b998">
    github.com/<tspan fill="#f6efe3" font-weight="700">Cherie05</tspan> &#160;•&#160; 29 PUBLIC REPOS
  </text>

  <!-- Title and Primary Role -->
  <text x="26" y="78" class="boho-font-title" font-size="20">ARUN VPP</text>
  <text x="142" y="77" class="boho-font-sans" font-size="12" font-weight="600" fill="#e08e36" letter-spacing="0.5">SYSTEMS ARCHITECT &amp; PRODUCT ENGINEER</text>
  <text x="26" y="98" class="boho-font-sans" font-size="11.5" fill="#d8b998" opacity="0.9">
    Architecting end-to-end products: scalable web architectures, developer tooling, sovereign AI, and native mobile engines.
  </text>

  <!-- DIVIDER LINE -->
  <line x1="26" y1="112" x2="814" y2="112" stroke="#c86446" stroke-width="1" stroke-opacity="0.3" />

  <!-- THREE DOMAIN COLUMNS -->
  <!-- Column 1: Websites and SaaS Platforms -->
  <rect x="26" y="124" width="250" height="96" rx="8" fill="#1e1814" stroke="#c86446" stroke-width="0.8" stroke-opacity="0.4" />
  <circle cx="44" cy="142" r="3" fill="#c86446" />
  <text x="54" y="146" class="boho-font-mono" font-size="11" font-weight="700" fill="#e08e36">WEBSITES &amp; SAAS</text>
  <text x="44" y="166" class="boho-font-sans" font-size="10.5" fill="#f6efe3" font-weight="500">Next.js • React • Node.js • Elixir</text>
  <text x="44" y="184" class="boho-font-sans" font-size="10" fill="#d8b998" opacity="0.85">PostgreSQL, Redis caching, real-time</text>
  <text x="44" y="199" class="boho-font-sans" font-size="10" fill="#d8b998" opacity="0.85">Phoenix LiveView websockets &amp; APIs</text>

  <!-- Column 2: Developer Tools and Local AI -->
  <rect x="295" y="124" width="250" height="96" rx="8" fill="#1e1814" stroke="#6f8b6d" stroke-width="0.8" stroke-opacity="0.4" />
  <circle cx="313" cy="142" r="3" fill="#6f8b6d" />
  <text x="323" y="146" class="boho-font-mono" font-size="11" font-weight="700" fill="#88a885">AI &amp; DEVELOPER TOOLS</text>
  <text x="313" y="166" class="boho-font-sans" font-size="10.5" fill="#f6efe3" font-weight="500">PyTorch • ONNX • Ollama • Llama.cpp</text>
  <text x="313" y="184" class="boho-font-sans" font-size="10" fill="#d8b998" opacity="0.85">Browser WASM neural models, local LLMs,</text>
  <text x="313" y="199" class="boho-font-sans" font-size="10" fill="#d8b998" opacity="0.85">custom editor kernels &amp; Rust renderers</text>

  <!-- Column 3: Mobile and Cross-Platform -->
  <rect x="564" y="124" width="250" height="96" rx="8" fill="#1e1814" stroke="#e08e36" stroke-width="0.8" stroke-opacity="0.4" />
  <circle cx="582" cy="142" r="3" fill="#e08e36" />
  <text x="592" y="146" class="boho-font-mono" font-size="11" font-weight="700" fill="#d87a5c">MOBILE &amp; CROSS-PLATFORM</text>
  <text x="582" y="166" class="boho-font-sans" font-size="10.5" fill="#f6efe3" font-weight="500">Flutter • React Native • Expo • C++ NDK</text>
  <text x="582" y="184" class="boho-font-sans" font-size="10" fill="#d8b998" opacity="0.85">Offline-first SQLite persistence, Dart,</text>
  <text x="582" y="199" class="boho-font-sans" font-size="10" fill="#d8b998" opacity="0.85">psychoacoustic DSP &amp; mobile neural weights</text>

  <!-- FOOTER BAR -->
  <line x1="26" y1="234" x2="814" y2="234" stroke="#6f8b6d" stroke-width="0.8" stroke-opacity="0.25" />
  <text x="26" y="255" class="boho-font-mono" font-size="9.5" fill="#8c7767">
    PROVENANCE: MMXXIII – MMXXVI &#160;•&#160; FIRST-PRINCIPLES CRAFT &#160;•&#160; ZERO FLUFF
  </text>
  <text x="814" y="255" text-anchor="end" class="boho-font-mono" font-size="9.5" font-weight="700" fill="#e08e36">
    AUTHENTIC REPOSITORIES &amp; FORGES
  </text>
</svg>